[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-human-tdoa-project"
version = "0.1.0"
description = "Research prototype for analog residual-energy TDOA sound localization using magnetic tape."
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE.txt"}
authors = [
    {name = "Walid Hassan Mohammad Al-Motawakil"},
    {name = "Najib Mohammed Al-Amir"},
]
keywords = ["tdoa", "sound-localization", "analog-signal-processing", "magnetic-tape", "residual-energy"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Signal Processing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=24.0",
    "flake8>=7.0",
]

[project.urls]
Repository = "https://github.com/walidddhony-rgb/ai_human_tdoa_project"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.py-modules]
analog_channel_model = {}
analog_signal_model = {}
analog_simulation = {}
hardware_config = {}
metrics = {}
plot_results = {}
residual_energy = {}
robustness_sweep = {}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.flake8]
max-line-length = 100
